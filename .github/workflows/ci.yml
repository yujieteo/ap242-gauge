name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm ci
      - run: npm run build
      - name: Committed dist matches the sources
        run: git diff --exit-code -- dist/
      - run: npm test

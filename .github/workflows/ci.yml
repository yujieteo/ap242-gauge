name: ci
on:
  push:
    branches: [main]
  pull_request:
# The job only reads the repository.
permissions:
  contents: read
# A new push to a pull request cancels the run for the older push.
# Runs on main are never cancelled, so each commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The bash shell of Actions stops at the first failing command, also inside a pipe.
defaults:
  run:
    shell: bash
jobs:
  build-test:
    # The desktop runner is NixOS. It has nix, git and a few basic tools, and
    # the job gets bun from nixpkgs.
    runs-on: [self-hosted, desktop]
    timeout-minutes: 20
    steps:
      # Each job runs as a new user with no home folder. Nix and bun want one.
      - name: Make a home folder
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      # The output replay of bun run check compares the outputs with the
      # merge base of HEAD and origin/main, so the job needs the full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # bun.lock needs bun 1.4, and nixpkgs has bun 1.3.13, which cannot read it.
      # So this takes the nixpkgs bun package and gives it the official
      # bun 1.4.4 release file. The hash is the SHA-256 that the bun release
      # publishes. A plain download of bun runs on NixOS only through nix-ld,
      # which needs the NIX_LD setting that a job may not get. The nixpkgs
      # package fixes the binary itself, so it runs without nix-ld.
      - name: Get bun 1.4.4
        run: |
          bun="$(nix build --no-link --print-out-paths --impure --expr '
            let pkgs = (builtins.getFlake "nixpkgs").legacyPackages.x86_64-linux;
            in pkgs.bun.overrideAttrs (old: {
              version = "1.4.4";
              src = pkgs.fetchurl {
                url = "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip";
                hash = "sha256-v4zL+ysLgBWeD5ptFcVTF63YB3U028YTCj7bUvzLOVw=";
              };
            })')"
          echo "$bun/bin" >> "$GITHUB_PATH"
      - run: bun --version
      - run: bun install --frozen-lockfile
      # The one check of the README: type check, source rules, dead code,
      # tests, committed dist, page budget and output replay.
      - run: bun run check
